[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tan-telecom"
version = "1.0.0"
description = "CLI de diseño paramétrico de tableros TAN (IEC 61439) para nodos de telecomunicaciones"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrei Barwood / CFT Electricidad" }]
keywords = ["IEC 61439", "TAN", "tableros", "telecomunicaciones", "CLI"]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "fpdf2>=2.7.0",
]

[project.scripts]
tan-telecom = "main:main"

[tool.setuptools]
py-modules = [
  "main",
  "cli",
  "calculations",
  "rules",
  "models",
  "validators",
]
packages = ["generators"]

[tool.setuptools.package-data]
"*" = ["data/*.json"]
